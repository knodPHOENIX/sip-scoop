name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build the APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename the APK
        run: cp app/build/outputs/apk/release/app-release.apk SipAndScoop.apk

      - name: Keep the APK with this run
        # A GitHub storage hiccup here shouldn't stop the release below.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: SipAndScoop-apk
          path: SipAndScoop.apk

      - name: Publish a download on the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Sip & Scoop build ${{ github.run_number }}
          body: Download SipAndScoop.apk below and open it on your phone to install.
          files: SipAndScoop.apk
